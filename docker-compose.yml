services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: vise
      MYSQL_USER: vise
      MYSQL_PASSWORD: vise
      MYSQL_ROOT_PASSWORD: root
    ports: ["3307:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  app:
    build: ./backend
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      SECRET_KEY: change-me-local-dev-vise-sma
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: vise
      DB_USER: vise
      DB_PASSWORD: vise
      CORS_ORIGINS: "*"
    ports: ["8000:8000"]
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  mysql_data:
